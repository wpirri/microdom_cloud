#
# a2enmod ssl proxy proxy_http proxy_balancer lbmethod_byrequests headers
#
<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName lnk3001
        # Logs
        ErrorLog ${APACHE_LOG_DIR}/proxy-8083-error.log
        CustomLog ${APACHE_LOG_DIR}/proxy-8083-access.log combined
        # SSL
        SSLEngine On
        SSLOptions +StrictRequire
        SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
        SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
        # Intermediate configuration, tweak to your needs
        SSLProtocol             all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
        SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
        SSLHonorCipherOrder     off
        SSLSessionTickets       off
        # Add vhost name to log entries:
        LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-agent}i\"" vhost_combined
        LogFormat "%v %h %l %u %t \"%r\" %>s %b" vhost_common
        # Proxy HTTPS entrante hacia servicios HTTP locales
        ProxyRequests Off
        ProxyPreserveHost On
        SSLProxyEngine on
        SSLProxyVerify none
        SSLProxyCheckPeerCN off
        SSLProxyCheckPeerName off
        SSLProxyCheckPeerExpire off
        # Normalizar los contextos sin barra final
        RedirectMatch 301 ^/home$ /home/
        RedirectMatch 301 ^/amazon$ /amazon/

        # Los prefijos específicos deben ir antes de la ruta raíz
        ProxyPass        /home/   http://127.0.0.1:8080/
        ProxyPassReverse /home/   http://127.0.0.1:8080/

        ProxyPass        /amazon/ http://127.0.0.1:8083/
        ProxyPassReverse /amazon/ http://127.0.0.1:8083/

        # La ruta raíz va al final porque también puede coincidir con cualquier ruta
        ProxyPass        /        http://127.0.0.1:8082/
        ProxyPassReverse /        http://127.0.0.1:8082/

        # Protecciones
        ProxyBadHeader Ignore
        ProxyErrorOverride On
        RequestHeader unset Proxy

    </VirtualHost>
</IfModule>
